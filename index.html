<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1 id="title">Number Guessing Game</h1>
        <div id="background">
            <h2>Guess a number between 1 and 10 </h2>
            <input type="number" id="guess" name="tentacles" min="1" max="10" />
            <button id="guess-button">Make a Guess</button>
            <h2 id="result"></h2>;
            <button id="reset-button">Reset Game</button>
        </div>
        <script src="script.js" defer></script>
    </body>
</html>
